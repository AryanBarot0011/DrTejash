<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- SEO Meta Tags -->
  <title>Our Products - Swayambhu Ayurvedam</title>
  <meta name="description" content="Explore our full catalog of Ayurvedic & herbal products. Pure Shampoos, Soaps, Face Washes, Hair Oils, and herbal remedies.">
  
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.min.css" rel="stylesheet">
  <!-- AOS Animation CSS -->
  <link href="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.css" rel="stylesheet">
  
  <!-- Custom CSS -->
  <link href="assets/css/style.css" rel="stylesheet">
</head>
<body data-page="products">

  <!-- Layout placeholders -->
  <div id="loader-placeholder"></div>
  <div id="top-header-placeholder"></div>
  <div id="navbar-placeholder"></div>

  <!-- PRODUCTS HERO SECTION -->
  <section class="py-5 bg-gradient text-center" style="background-color: rgba(0, 150, 136, 0.05);">
    <div class="container py-4">
      <h1 class="display-4 fw-bold" data-i18n="prod_hero_title">Our Product Showcase</h1>
      <p class="lead text-light max-w-600 mx-auto" data-i18n="prod_hero_subtitle">Search, filter, and discover natural remedies for a healthy lifestyle.</p>
    </div>
  </section>

  <!-- PRODUCTS CATALOG BODY -->
  <section class="py-5 bg-white">
    <div class="container py-4">
      <!-- Filter Bar -->
      <div class="filter-bar" data-aos="fade-up">
        <div class="row g-3 align-items-center">
          <!-- Col 1: Search -->
          <div class="col-lg-6 col-md-6 col-12">
            <div class="search-box">
              <i class="bi bi-search"></i>
              <input type="text" class="form-control" id="searchInput" placeholder="Search by product name or category..." data-i18n="search_placeholder">
            </div>
          </div>
          
          <!-- Col 2: Sort dropdown -->
          <div class="col-lg-6 col-md-6 col-12 d-flex align-items-center justify-content-md-end gap-2">
            <label for="sortSelect" class="text-nowrap fw-semibold text-light mb-0" data-i18n="filter_sort">Sort By</label>
            <select class="form-select w-auto" id="sortSelect" style="border-radius: 10px;">
              <option value="default" data-i18n="sort_default">Default Sorting</option>
              <option value="price-low-high" data-i18n="sort_price_low_high">Price: Low to High</option>
              <option value="price-high-low" data-i18n="sort_price_high_low">Price: High to Low</option>
              <option value="popular" data-i18n="sort_popular">Popular Products</option>
              <option value="new" data-i18n="sort_new">New Products</option>
            </select>
          </div>
        </div>
      </div>
      
      <!-- Category Tabs Layout -->
      <div class="catalog-tabs justify-content-lg-start justify-content-center" data-aos="fade-up">
        <div class="catalog-tab active" data-category="all" data-i18n="tab_all">All Products</div>
        <div class="catalog-tab" data-category="hair-care" data-i18n="tab_haircare">Hair Care</div>
        <div class="catalog-tab" data-category="beauty-care" data-i18n="tab_beautycare">Beauty Care</div>
        <div class="catalog-tab" data-category="baby-care" data-i18n="tab_babycare">Baby Care</div>
        <div class="catalog-tab" data-category="bathing" data-i18n="tab_bathing">Bathing Products</div>
        <div class="catalog-tab" data-category="winter-care" data-i18n="tab_wintercare">Winter Care</div>
      </div>
      
      <!-- Product Grid (Dynamically rendered by main.js) -->
      <div class="row g-4" id="products-catalog-grid">
        <!-- Rendered cards -->
      </div>
      
      <!-- Pagination Controls (Dynamically rendered by main.js) -->
      <div class="pagination-container" id="pagination" data-aos="fade-up">
        <!-- Pagination Buttons -->
      </div>
    </div>
  </section>

  <!-- Layout placeholders -->
  <div id="footer-placeholder"></div>
  <div id="floats-placeholder"></div>

  <!-- Bootstrap 5 Bundle JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <!-- AOS Scroll Animation JS -->
  <script src="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.js"></script>
  
  <!-- Custom scripts -->
  <script src="assets/js/config.js"></script>
  <script src="assets/js/translations.js"></script>
  <script src="assets/js/products.js"></script>
  <script src="assets/js/main.js"></script>
</body>
</html>

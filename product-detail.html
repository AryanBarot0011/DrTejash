<!DOCTYPE html>
<html lang="en">
<head>

  <!-- Bootstrap 5 CSS -->

  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.min.css" rel="stylesheet">
  <!-- AOS Animation CSS -->
  <link href="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.css" rel="stylesheet">

  <link href="assets/css/style.css" rel="stylesheet">

<body data-page="product-detail">

  <!-- Layout placeholders -->
  <div id="loader-placeholder"></div>
  <div id="top-header-placeholder"></div>
  <div id="navbar-placeholder"></div>

  <section class="bg-light py-3 border-bottom border-light">
    <div class="container">
      <nav aria-label="breadcrumb">
        <ol class="breadcrumb mb-0">
          <li class="breadcrumb-item"><a href="index.html" data-i18n="nav_home">Home</a></li>
          <li class="breadcrumb-item"><a href="products.html" data-i18n="nav_products">Products</a></li>
          <li class="breadcrumb-item active" id="breadcrumb-product-name" aria-current="page">Product Name</li>
        </ol>
      </nav>
    </div>
  </section>

  <!-- PRODUCT DETAIL MAIN CONTAINER -->
  <section class="py-5 bg-white">

      <div class="row g-4 justify-content-center" id="related-products-row" data-aos="fade-up">
        <!-- Related cards injected by main.js -->
      </div>
      
      <div class="text-center mt-5">
        <a href="products.html" class="btn btn-secondary-custom d-inline-flex align-items-center gap-2">
          <i class="bi bi-arrow-left"></i> <span data-i18n="back_to_products">Back to Products</span>

      </div>
    </div>
  </section>

  <!-- Layout placeholders -->

  <div id="floats-placeholder"></div>

  <!-- Bootstrap 5 Bundle JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <!-- AOS Scroll Animation JS -->

  <!-- Custom scripts -->
  <script src="assets/js/config.js"></script>
